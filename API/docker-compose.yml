services:
  api:
    build:
      context: .
      target: runner
    container_name: novel-reading-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - ./.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    env_file:
      - ./.env
    profiles: ["migrate"]
